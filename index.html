<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ドルアーガの塔 迷路ジェネレータ</title>
<style>
  body{margin:0;background:#000;color:#eee;font-family:ui-monospace,Menlo,monospace;padding:16px}
  h1{font-size:18px;margin:0 0 12px}
  .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  button,input,select{background:#222;color:#eee;border:1px solid #555;padding:6px 10px;font:inherit}
  canvas{max-width:100%;height:auto;background:#000;border:1px solid #333}
  dl{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;margin:12px 0}
  dt{color:#888}
  dd{margin:0}
  .seed{color:#ffd23f;font-weight:bold}
</style>
</head>
<body>
<h1>ドルアーガの塔 迷路ジェネレータ</h1>
<div class="row">
  <button id="prev">◀</button>
  <label>フロア <input id="floor" type="number" min="1" max="60" value="1" style="width:5em"></label>
  <button id="next">▶</button>
</div>
<canvas id="c"></canvas>
<dl>
  <dt>フロア</dt><dd id="i-floor"></dd>
  <dt>アルゴリズム</dt><dd id="i-algo"></dd>
  <dt>乱数</dt><dd id="i-rng"></dd>
  <dt>シード値</dt><dd id="i-seed" class="seed"></dd>
</dl>
<script src="maze.js"></script>
<script>
const { MAX_X, MAX_Y, ALGORITHM, seedOf, generate } = Druaga;
const S = 32, cv = document.getElementById("c"), g = cv.getContext("2d");
cv.width = (MAX_X + 1) * S + 16; cv.height = (MAX_Y + 1) * S + 16;
const $ = (id) => document.getElementById(id);

function draw(m) {
  g.clearRect(0, 0, cv.width, cv.height);
  g.translate(8, 8);
  g.strokeStyle = "#3b6cff"; g.lineWidth = 4; g.lineCap = "round";
  const seg = (x1, y1, x2, y2) => { g.beginPath(); g.moveTo(x1 * S, y1 * S); g.lineTo(x2 * S, y2 * S); g.stroke(); };
  g.strokeRect(0, 0, (MAX_X + 1) * S, (MAX_Y + 1) * S);
  for (let x = 0; x < MAX_X; x++) for (let y = 0; y <= MAX_Y; y++)
    if (m.wall1[x][y]) seg(x + 1, y, x + 1, y + 1);
  for (let x = 0; x <= MAX_X; x++) for (let y = 0; y < MAX_Y; y++)
    if (m.wall2[x][y]) seg(x, y + 1, x + 1, y + 1);
  g.setTransform(1, 0, 0, 1, 0, 0);
}

function show(f) {
  f = Math.min(60, Math.max(1, f | 0 || 1));
  const seed = seedOf(f);
  $("floor").value = f;
  draw(generate(seed));
  $("i-floor").textContent = f + "F";
  $("i-algo").textContent = ALGORITHM.name;
  $("i-rng").textContent = ALGORITHM.rng;
  $("i-seed").textContent = seed + " (0x" + seed.toString(16).toUpperCase().padStart(2, "0") + ")";
}
$("floor").oninput = (e) => show(+e.target.value);
$("prev").onclick = () => show(+$("floor").value - 1);
$("next").onclick = () => show(+$("floor").value + 1);
show(1);
</script>
</body>
</html>
